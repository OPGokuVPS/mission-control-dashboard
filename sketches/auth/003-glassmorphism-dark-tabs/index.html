<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission Control — Login (Glass Card)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* Animated gradient mesh background */
    .mesh-bg {
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 40% 80%, rgba(236,72,153,0.10) 0%, transparent 50%),
        #0f0f1a;
      animation: meshShift 15s ease-in-out infinite alternate;
    }
    @keyframes meshShift {
      0% { background-position: 0% 0%, 0% 0%, 0% 0%; }
      100% { background-position: 5% 5%, -3% 3%, 2% -2%; }
    }
    
    /* Floating particles */
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }
    
    /* Glass card */
    .glass-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
    }
    
    /* Neon glow on focus */
    .neon-focus:focus {
      border-color: rgba(139,92,246,0.5);
      box-shadow: 0 0 0 2px rgba(139,92,246,0.1), 0 0 20px rgba(139,92,246,0.15);
    }
    
    /* Pulsing button glow */
    .btn-glow {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .btn-glow::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899, #a855f7, #6366f1);
      background-size: 200% 200%;
      border-radius: 10px;
      z-index: -1;
      animation: glowRotate 3s linear infinite;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .btn-glow:hover::before {
      opacity: 1;
    }
    .btn-glow:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(99,102,241,0.3);
    }
    @keyframes glowRotate {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    
    /* Social button with subtle glow */
    .social-btn {
      transition: all 0.2s ease;
      position: relative;
    }
    .social-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-1px);
    }
    
    /* Input autofill override */
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px #1a1a2e inset !important;
      -webkit-text-fill-color: #e2e8f0 !important;
    }
    
    /* Fade in animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeInUp { animation: fadeInUp 0.6s ease forwards; opacity: 0; }
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
  </style>
</head>
<body class="mesh-bg min-h-screen flex items-center justify-center p-6 overflow-hidden relative">
  
  <!-- Floating particles -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden" id="particles"></div>
  
  <div class="w-full max-w-sm relative z-10">
    <!-- Logo centered above -->
    <div class="text-center mb-8 animate-fadeInUp">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white mb-4 shadow-lg shadow-purple-500/20">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="text-lg font-semibold text-white tracking-wide">MISSION CONTROL</h1>
      <p class="text-xs text-slate-500 mt-1 tracking-wide uppercase">Autonomous AI Factory Dashboard</p>
    </div>
    
    <!-- Glass Card -->
    <div class="glass-card rounded-2xl p-6 animate-fadeInUp delay-100">
      
      <!-- Auth method tabs -->
      <div class="flex gap-1 bg-white/5 rounded-xl p-1 mb-6">
        <button onclick="switchTab('oauth')" id="tab-oauth" class="tab-btn flex-1 py-2 px-3 text-xs font-medium rounded-lg text-white bg-white/10 transition-all">
          Social
        </button>
        <button onclick="switchTab('email')" id="tab-email" class="tab-btn flex-1 py-2 px-3 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all">
          Email
        </button>
      </div>
      
      <!-- OAuth tab content -->
      <div id="panel-oauth">
        <div class="space-y-2">
          <button class="social-btn w-full flex items-center justify-center gap-3 py-2.5 px-4 border border-white/10 rounded-xl text-sm text-white/90">
            <svg class="w-4 h-4" viewBox="0 0 24 24" width="16" height="16"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
          </button>
          <button class="social-btn w-full flex items-center justify-center gap-3 py-2.5 px-4 border border-white/10 rounded-xl text-sm text-white/90">
            <svg class="w-4 h-4" fill="#fff" viewBox="0 0 24 24" width="16" height="16"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            Continue with GitHub
          </button>
        </div>
      </div>
      
      <!-- Email tab content (hidden by default) -->
      <div id="panel-email" class="hidden">
        <form class="space-y-4" onsubmit="event.preventDefault(); showToast();">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5 ml-0.5">Email address</label>
            <input type="email" placeholder="you@example.com" class="neon-focus w-full px-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-600 outline-none transition-all text-sm">
          </div>
          
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5 ml-0.5">Password</label>
            <div class="relative">
              <input type="password" id="pw" value="••••••••" class="neon-focus w-full px-4 py-2.5 pr-10 bg-white/5 border border-white/10 rounded-xl text-white placeholder-slate-600 outline-none transition-all text-sm">
              <button type="button" onclick="togglePw()" class="absolute right-3 top-[26px] text-slate-500 hover:text-slate-300 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="eyeIcon">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>
          
          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="rounded border-white/20 bg-white/5 text-indigo-500 focus:ring-indigo-500 accent-indigo-500">
              <span class="text-slate-400">Remember me</span>
            </label>
            <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium">Forgot password?</a>
          </div>
          
          <button type="submit" class="btn-glow w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white text-sm font-semibold py-2.5 rounded-xl">
            Sign In
          </button>
        </form>
      </div>
    </div>
    
    <!-- Signup link -->
    <p class="mt-6 text-center text-xs text-slate-500 animate-fadeInUp delay-200">
      Don't have an account? 
      <a href="#" class="text-indigo-400 hover:text-indigo-300 font-medium">Create one now</a>
    </p>
    
    <p class="mt-4 text-center text-[10px] text-slate-600 animate-fadeInUp delay-300">
      Secured by Supabase · End-to-end encrypted
    </p>
  </div>
  
  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-emerald-500/90 backdrop-blur text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium hidden items-center gap-2">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
    Signed in successfully!
  </div>
  
  <script>
    // Generate floating particles
    const particles = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 15 + 10) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (Math.random() * 2 + 1) + 'px';
      particles.appendChild(p);
    }
    
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('text-white', 'bg-white/10');
        b.classList.add('text-slate-400');
      });
      document.getElementById('tab-' + tab).classList.add('text-white', 'bg-white/10');
      document.getElementById('tab-' + tab).classList.remove('text-slate-400');
      
      document.getElementById('panel-oauth').classList.toggle('hidden', tab !== 'oauth');
      document.getElementById('panel-email').classList.toggle('hidden', tab !== 'email');
    }
    
    function togglePw() {
      const pw = document.getElementById('pw');
      const icon = document.getElementById('eyeIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        pw.value = 'DemoPass123';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
      } else {
        pw.type = 'password';
        pw.value = '••••••••';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
      }
    }
    
    function showToast() {
      document.getElementById('toast').classList.remove('hidden');
      document.getElementById('toast').classList.add('flex');
    }
  </script>
</body>
</html>
